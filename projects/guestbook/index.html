<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYON Guest Book</title>
    
    <!-- 💡 구글 폰트 불러오기 (Gowun Dodum) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>📌🌟 SYON Guest Book 🧷📝</h1>

        <div class="form-card">
            <h2>닉네임/별명</h2>
            <input id="name" type="text" placeholder="닉네임을 입력하세요">

            <h2>내용</h2>
            <textarea id="message" placeholder="소중한 방명록, 응원의 말을 남겨주세요 💜"></textarea>

            <button id="addBtn">등록하기 ✨</button>
        </div>

        <hr class="divider">

        <!-- 방명록 카드들이 쌓이는 영역 -->
        <div id="guestbook"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
