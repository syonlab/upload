<!DOCTYPE html>

<head>

<body class="main-page">

                        </tr>
                        <tr>
                            <td><span class="day-badge">Day 04</span></td>

                        <tr>
                            <td><span class="day-badge">Day 05</span></td>

                            <td><a href="day05/index.html" class="table-btn">이동하기 ➔</a></td>
                        </tr>
                        <tr>
                            <td><span class="day-badge">Day 06</span></td>
                            <td class="log-title">채팅방 만들기</td>
                            <td><a href="day06/index.html" class="table-btn">이동하기 ➔</a></td>

                        <tr>
